services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coolhat-backend
    restart: unless-stopped
    environment:
      # Server
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Database
      DATABASE_URL: ${DATABASE_URL}
      # Cloudinary
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      # AI / RAG
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX}
      PINECONE_VECTOR_DIM: ${PINECONE_VECTOR_DIM}
      PINECONE_NAMESPACE_PREFIX: ${PINECONE_NAMESPACE_PREFIX}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPEN_AI_API: ${OPEN_AI_API}
      OPEN_AI_MODEL: ${OPEN_AI_MODEL:-gpt-4o-mini}
      # Authentication
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS}
      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      # Store Setup
      STORE_URL_PROTOCOL: ${STORE_URL_PROTOCOL:-http}
      STORE_BASE_DOMAIN: ${STORE_BASE_DOMAIN}
      STORE_URL_PORT: ${STORE_URL_PORT:-3000}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL}
      TELEGRAM_MINI_APP_SESSION_TTL_MINUTES: ${TELEGRAM_MINI_APP_SESSION_TTL_MINUTES:-480}
    ports:
      - "8080:8080"
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: coolhat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    expose:
      - "3000"
