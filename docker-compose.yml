services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coolhat-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: coolhat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    expose:
      - "3000"
